name: extraspace
services:
  postgres:
    image: postgres:18.6
    environment:
      POSTGRES_DB: extraspace
      # Local only: no password, and the port is bound to 127.0.0.1.
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql
  seq:
    image: datalust/seq:2026.1
    environment:
      ACCEPT_EULA: "Y"
      SEQ_FIRSTRUN_NOAUTHENTICATION: "true"
    ports:
      - "127.0.0.1:5341:80"
    volumes:
      - seqdata:/data
volumes:
  pgdata:
  seqdata:
